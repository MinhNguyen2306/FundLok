services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fundlok_dev
      POSTGRES_USER: fundlok
      POSTGRES_PASSWORD: fundlok
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
