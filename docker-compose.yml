services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fundlok_dev
      POSTGRES_USER: fundlok
      POSTGRES_PASSWORD: fundlok
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "8025:8025" 
      - "1025:1025" 
    environment:
      MP_MAX_MESSAGES: 5000

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # S3 API port
      - "9001:9001"   # Web UI console port
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Full-container run of the API (used by `bun run docker:up`). For day-to-day
  # dev prefer `bun run dev` (uvicorn on the host with hot reload). The
  # entrypoint runs `alembic upgrade head` before starting uvicorn.
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      # Override .env values that point at host "localhost" so they resolve on
      # the compose network instead.
      DATABASE_URL: postgresql+psycopg2://fundlok:fundlok@postgres:5432/fundlok_dev
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data: