[pytest]
# HANDOFF-02 Fix A: the app and its test client are now async (AsyncSession,
# httpx.AsyncClient). asyncio_mode = auto lets test functions be plain
# `async def` without needing @pytest.mark.asyncio on every single one.
asyncio_mode = auto
# app/core/database.py's AsyncEngine (and its asyncpg connection pool) is a
# module-level singleton created once at import time, outside of any test's
# event loop. pytest-asyncio's default is a fresh event loop per test
# function; reusing pooled asyncpg connections across those loops raises
# "Event loop is closed" / "attached to a different loop". Pinning both the
# fixture and test loop scope to "session" gives the whole run one loop, so
# the engine's pooled connections stay valid for every test that borrows one.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
