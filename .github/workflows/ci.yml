# Backend CI/CD — single pipeline for tests AND deploys (one mechanism only;
# the console-created Cloud Build trigger has been deleted, see
# docs/deployment/ci-cd-pipeline.md).
#
#   PR to dev / preview / main  -> migration check + tests
#   push to dev                 -> migration check + tests -> deploy "staging"
#   push to main                -> migration check + tests -> deploy "prod-api"
#
# Deploy jobs are gated with `needs:` — a failing test suite never ships.
# Google Cloud auth is keyless via Workload Identity Federation.
#
# Required GitHub repository secrets:
#   SECRET_KEY          production JWT signing key
#   STAGING_SECRET_KEY  staging JWT signing key (must differ from prod)
#   FUNLOK_DB           staging DATABASE_URL
# Production DATABASE_URL is intentionally NOT set here — it lives on the
# prod-api Cloud Run service config and survives deploys because
# deploy-cloudrun@v2 merges env_vars (see commit 36ad182).

name: Backend CI/CD

on:
  push:
    branches: [ "main", "preview" ]
  pull_request:
    branches: [ "main", "preview" ]

# One run at a time per branch; never cancel a deploy mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migration-check:
    name: Check Schema Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://test_user:test_password@localhost:5432/test_db
      SECRET_KEY: dummy_secret_key_for_testing
      DEBUG: True

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations to head
        run: alembic upgrade head

      - name: Check for missing migrations
        # alembic check compares the database schema with the SQLAlchemy models.
        # It will exit with an error code if the models contain changes that
        # haven't been generated in a migration script.
        run: alembic check

  tests:
    name: Run Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # No job-level DATABASE_URL: Alembic (sync psycopg2) and the app/tests
      # (async asyncpg, HANDOFF-02 Fix A) need different drivers, so each is
      # set per-step below instead of forcing one URL for both.
      SECRET_KEY: dummy_secret_key_for_testing
      DEBUG: True

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations to head
        env:
          DATABASE_URL: postgresql+psycopg2://test_user:test_password@localhost:5432/test_db
        run: alembic upgrade head

      - name: Run test suite
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
        run: pytest -q

  deploy-staging:
    name: Deploy to Cloud Run (staging)
    runs-on: ubuntu-latest
    needs: [migration-check, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      PROJECT_ID: 'fundlok'
      REGION: 'asia-southeast1'
      SERVICE: 'staging'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332' # actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2' # google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1086381007504/locations/global/workloadIdentityPools/fundlok/providers/github'
          service_account: 'github-deploy@fundlok.iam.gserviceaccount.com'

      - name: 'Deploy to Cloud Run'
        id: 'deploy'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: '${{ env.SERVICE }}'
          region: '${{ env.REGION }}'
          project_id: '${{ env.PROJECT_ID }}'
          source: './'
          flags: '--add-cloudsql-instances fundlok:asia-southeast1:fundlok'
          env_vars: |
            DATABASE_URL=${{ secrets.FUNLOK_DB }}
            SECRET_KEY=${{ secrets.STAGING_SECRET_KEY }}

      - name: 'Show output'
        run: |-
          echo ${{ steps.deploy.outputs.url }}

  deploy-production:
    name: Deploy to Cloud Run (prod-api)
    runs-on: ubuntu-latest
    needs: [migration-check, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      PROJECT_ID: 'fundlok'
      REGION: 'asia-southeast1'
      SERVICE: 'prod-api'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332' # actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2' # google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1086381007504/locations/global/workloadIdentityPools/fundlok/providers/github'
          service_account: 'github-deploy@fundlok.iam.gserviceaccount.com'

      - name: 'Deploy to Cloud Run'
        id: 'deploy'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: '${{ env.SERVICE }}'
          region: '${{ env.REGION }}'
          project_id: '${{ env.PROJECT_ID }}'
          source: './'
          flags: '--add-cloudsql-instances fundlok:asia-southeast1:fundlok'
          env_vars: |
            SECRET_KEY=${{ secrets.SECRET_KEY }}

      - name: 'Show output'
        run: |-
          echo ${{ steps.deploy.outputs.url }}
