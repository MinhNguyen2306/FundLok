# FundLok — Sector Reference Table
#
# STATUS: DRAFT — every value is UNREVIEWED. Loc Vuong (CEO) owns the content and
# must review before this is used to price a real loan. See `review` block below.
#
# WHAT THIS IS
# The seven per-industry values the grading engine cannot compute from an SME's own
# financials. Six are finished 0-100 factor scores (higher = lower risk). The
# seventh, `cagr_pct`, is a RAW percentage that the engine feeds through factor 13's
# sigmoid — it is not a score and must not be validated as one.
#
# 15 industries x 7 columns = 105 values.
#
# WHY A TABLE AND NOT AN LLM CALL AT SCORING TIME
# Sector risk is systematic: every F&B borrower faces the same regulatory and
# cyclical exposure, so an industry-level number is the correct model, not a
# compromise. And it is explainable — "Construction Materials scores 25 on
# cyclicality, table v1" is defensible to a borrower or to the SBV. An inline LLM
# call is not reproducible and would break replay. AI is used to AUTHOR this file
# offline (see sector_reference_prompt.md), reviewed by a human, then versioned.
#
# CRITICAL — DO NOT WIRE THIS INTO grade()
# The golden-set fixture supplies its own per-row sector values. If this table is
# read inside the scoring path, all 10,000 regression rows stop reconciling. It is
# an ALTERNATIVE input source for production callers assembling a GradingInput.
# See docs/specs/underwriting/sector-reference-table.md section 6 R2.

sector_reference_version: "v1-20260728"
status: DRAFT_UNREVIEWED
authored_by: "Edward Wong (CTO), drafted from CEO rubric logic"
authoring_prompt: "sector_reference_prompt.md"

review:
  reviewed_by: null
  reviewed_at: null
  # Until reviewed_by is non-null, callers should surface results as provisional.

# ---------------------------------------------------------------------------
# Calibration constraints this draft was built to. Preserve these on any refresh
# or the whole book reprices — Sector drives 36% of the interest spread.
# ---------------------------------------------------------------------------
calibration:
  target_mean_premium: 54.75      # today's observed median Sector premium
  achieved_mean_premium: 53.56    # +2bp across the book vs today. Effectively neutral.
  target_spread: "wide, roughly 25-85 per factor"
  achieved_premium_range: [38.89, 71.97]
  differentiation: "66bp of interest-rate spread between best and worst industry"
  # Re-run scripts/check_sector_reference.py after any edit to confirm these hold.

# ---------------------------------------------------------------------------
# Per-column provenance. Refresh cadence differs by column — the natural update
# unit is a COLUMN (one factor across all 15 industries), because that is how the
# source data arrives. Event-driven regulatory changes may hit a single cell.
# ---------------------------------------------------------------------------
columns:
  regulatory:
    label: "Regulatory Exposure"
    factor_id: 14
    kind: score            # 0-100, higher = less exposed
    valid_range: [0, 100]
    source: "manual — Vietnamese sector licensing regimes"
    as_of: "2026-07"
    cadence: event-driven  # refresh when a relevant decree/circular lands
    reviewed_by: null

  input_cost_vol:
    label: "Input Cost Volatility"
    factor_id: 15
    kind: score
    valid_range: [0, 100]
    source: "manual — dominant input cost per sector"
    as_of: "2026-07"
    cadence: semi-annual
    reviewed_by: null

  cyclicality:
    label: "Cyclicality"
    factor_id: 16
    kind: score            # higher = more essential / defensive demand
    valid_range: [0, 100]
    source: "manual — essential vs discretionary demand"
    as_of: "2026-07"
    cadence: annual        # structural; rarely moves
    reviewed_by: null

  competitor:
    label: "Competitor Proxy"
    factor_id: 17
    kind: score            # higher = more defensible
    valid_range: [0, 100]
    source: "manual — barriers to entry, capital intensity"
    as_of: "2026-07"
    cadence: annual
    reviewed_by: null

  macro:
    label: "Macroeconomics Exposure"
    factor_id: 18
    kind: score            # higher = more insulated
    valid_range: [0, 100]
    source: "SBV rate/FX outlook — TO BE CONFIRMED with Loc"
    as_of: "2026-Q2"
    cadence: quarterly     # fastest-moving column
    reviewed_by: null

  uncontrollable:
    label: "Uncontrollable Risks"
    factor_id: 19
    kind: score            # higher = fewer exogenous risks
    valid_range: [0, 100]
    source: "manual — weather, disease, disaster exposure"
    as_of: "2026-07"
    cadence: annual
    reviewed_by: null

  cagr_pct:
    label: "Sector CAGR"
    factor_id: 13
    kind: raw_percent      # NOT a score. Fed to factor 13's sigmoid. May be negative.
    valid_range: [-20.0, 40.0]
    source: "GSO (General Statistics Office) — TO BE CONFIRMED with Loc"
    as_of: "2025"
    cadence: annual
    reviewed_by: null
    note: >
      Requirements section 2.4 always specified this as a config table; it was never
      supplied, so the engine currently takes it as a per-application input. This
      column is what closes that gap.

