# ---------------------------------------------------------------------------
# Non-sector constants that are also supplied rather than computed.
# ---------------------------------------------------------------------------
constants:
  founder: 50
  # Factor 22, Founder Experience/Credibility. CEO-approved as a hard-coded
  # constant (Slack, 28 Jul 2026), revisited at official launch. 50 is the
  # observed median in the golden set, so this is pricing-neutral. Scoring it
  # properly would mean profiling founders' public statements — real exposure
  # under Decree 13/2023 for a factor worth at most 4bp on the rate.

# ---------------------------------------------------------------------------
# Reasoning notes for the reviewer. Deliberately terse — the full rubric lives in
# sector_reference_prompt.md. These record the judgment behind non-obvious cells.
# ---------------------------------------------------------------------------
notes:
  - "Food & Beverage competitor 28 — per CEO: 'anybody can copy anyone'. Lowest
     barrier to entry of the 15."
  - "Manufacturing competitor 58 — per CEO: capital intensity is a real moat.
     Note the CEO's worked example expected F&B to be knocked out and manufacturing
     to pass; on the full seven factors manufacturing scores WORSE overall (50.80 vs
     53.72) because it loses on input costs, cyclicality and macro. The competitor
     intuition is right; the conclusion inverts."
  - "Logistics input_cost_vol 30 — per CEO's own example: fuel is the dominant
     input and it swings hard."
  - "Healthcare regulatory 30 is the worst in the table (heavy licensing), but it
     still ranks 2nd overall because cyclicality 88 and macro 78 are the best.
     Licensing is simultaneously a burden and a moat — hence competitor 70."
  - "Agriculture uncontrollable 20 is the worst cell in the table — typhoon, flood,
     disease. Vietnam-specific and not diversifiable by the borrower."
  - "Construction Materials ranks last: property-cycle dependent, commodity inputs,
     no moat, rate-sensitive. Reflects current Vietnamese property sector stress."
  - "Furniture & Woodwork regulatory 45 reflects timber-legality compliance burden
     (EUDR / Lacey Act) on exporters, not domestic licensing."
